name: Python Project CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"] # 3. Мультиверсійне тестування

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Linting (flake8)
      # 2. Перевірка стилю коду
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Tests with Pytest
      # 1. Автоматичне тестування та 5. HTML-звіт
      run: |
        pytest --html=report.html --self-contained-html

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pytest-report-python-${{ matrix.python-version }}
        path: report.html

  docker:
    needs: build # Запускається тільки якщо тести пройшли
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      # 4. Збірка Docker-контейнера
      run: |
        docker build -t my-python-app:latest .
